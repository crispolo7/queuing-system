<!DOCTYPE html>
<html>
<head>

    <title>COMELEC Admin Login</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- FAVICON -->
    <link
    rel="shortcut icon"
    href="{{ url_for('static', filename='favicon.ico') }}"
	>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family:Arial, sans-serif;
            background:linear-gradient(
                135deg,
                #003366,
                #00509e
            );
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            overflow:hidden;
        }

        /* BACKGROUND CIRCLES */

        .circle{
            position:absolute;
            border-radius:50%;
            background:rgba(255,255,255,0.08);
        }

        .circle1{
            width:300px;
            height:300px;
            top:-100px;
            left:-100px;
        }

        .circle2{
            width:250px;
            height:250px;
            bottom:-80px;
            right:-80px;
        }

        /* LOGIN CARD */

        .login-card{
            width:100%;
            max-width:420px;
            background:white;
            padding:40px;
            border-radius:25px;
            box-shadow:0 15px 40px rgba(0,0,0,0.3);
            position:relative;
            z-index:10;
        }

        /* LOGO */

        .logo{
            text-align:center;
            margin-bottom:20px;
        }

        .logo img{
            width:100px;
            height:100px;
            object-fit:contain;
        }

        /* TITLE */

        .title{
            text-align:center;
            margin-bottom:30px;
        }

        .title h1{
            color:#003366;
            font-size:32px;
            margin-bottom:10px;
        }

        .title p{
            color:#666;
            font-size:15px;
        }

        /* INPUTS */

        .input-group{
            margin-bottom:20px;
        }

        .input-group label{
            display:block;
            margin-bottom:8px;
            color:#333;
            font-weight:bold;
        }

        .input-group input{
            width:100%;
            padding:15px;
            border:2px solid #ddd;
            border-radius:12px;
            font-size:16px;
            transition:0.3s;
        }

        .input-group input:focus{
            border-color:#007bff;
            outline:none;
            box-shadow:0 0 10px rgba(0,123,255,0.2);
        }

        /* BUTTON */

        .login-btn{
            width:100%;
            padding:16px;
            background:#007bff;
            color:white;
            border:none;
            border-radius:12px;
            font-size:18px;
            font-weight:bold;
            cursor:pointer;
            transition:0.3s;
        }

        .login-btn:hover{
            background:#0056b3;
            transform:translateY(-2px);
        }

        /* FOOTER */

        .footer{
            text-align:center;
            margin-top:25px;
            color:#777;
            font-size:13px;
        }

        /* MOBILE */

        @media(max-width:500px){

            .login-card{
                margin:20px;
                padding:30px 25px;
            }

            .title h1{
                font-size:26px;
            }

        }

    </style>

</head>

<body>

<!-- BACKGROUND DESIGN -->

<div class="circle circle1"></div>
<div class="circle circle2"></div>

<!-- LOGIN CARD -->

<div class="login-card">

    <!-- LOGO -->

    <div class="logo">

        <img src="/static/logo.png">

    </div>

    <!-- TITLE -->

    <div class="title">

        <h1>COMELEC</h1>

        <p>Queue Management System</p>

    </div>

    <!-- LOGIN FORM -->

    <form method="POST">

        <input
            type="hidden"
            name="csrf_token"
            value="{{ csrf_token() }}"
        >

        {% if error %}
            <p role="alert" style="color:#b00020; margin-bottom:15px; text-align:center;">
                {{ error }}
            </p>
        {% endif %}

        <div class="input-group">

            <label>Username</label>

            <input
                type="text"
                name="username"
                placeholder="Enter username"
                required
            >

        </div>

        <div class="input-group">

            <label>Password</label>

            <input
                type="password"
                name="password"
                placeholder="Enter password"
                required
            >

        </div>

        <button
            type="submit"
            class="login-btn"
        >
            LOGIN
        </button>

    </form>

    <!-- FOOTER -->

    <div class="footer">

        Commission on Elections Queue System

    </div>

</div>

</body>
</html>
